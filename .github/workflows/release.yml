name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Create the release if missing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
          else
            gh release create "$TAG" --repo "$REPO" --title "$TAG" --generate-notes --verify-tag
          fi

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
          - os: macos-latest
            script: dist:mac
          - os: ubuntu-latest
            script: dist:linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Set package version from tag
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: npm version --no-git-tag-version --allow-same-version "${TAG#v}"
      - run: npm ci
      - run: node tests.mjs
      - name: Build
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run ${{ matrix.script }}
      # Windows code signing through SignPath. Skipped until the repository variable
      # SIGNPATH_ORGANIZATION_ID is set, so unsigned builds keep working. See SIGNING.md.
      - name: Upload unsigned Windows files
        id: upload-unsigned
        if: matrix.os == 'windows-latest' && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@v7
        with:
          name: windows-unsigned
          path: dist/Smith-Chart-Windows-*.exe
      - name: Sign Windows files with SignPath
        if: matrix.os == 'windows-latest' && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'smith-chart' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 10800
          output-artifact-directory: signed
      - name: Replace the Windows files with the signed ones
        if: matrix.os == 'windows-latest' && vars.SIGNPATH_ORGANIZATION_ID != ''
        shell: bash
        run: |
          ls -la signed
          cp signed/Smith-Chart-Windows-*.exe dist/
      - name: Upload assets to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          shopt -s nullglob
          files=(dist/Smith-Chart-*.exe dist/Smith-Chart-*.dmg dist/Smith-Chart-*.zip dist/Smith-Chart-*.AppImage dist/Smith-Chart-*.tar.gz)
          if [ ${#files[@]} -eq 0 ]; then echo "No artifacts found"; ls -la dist; exit 1; fi
          printf 'Uploading %s\n' "${files[@]}"
          gh release upload "$TAG" "${files[@]}" --repo "$REPO" --clobber
